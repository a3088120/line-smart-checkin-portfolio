<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="1050" viewBox="0 0 1450 1050" role="img" aria-labelledby="title desc">
  <title id="title">員工打卡及主管查詢工作流程</title>
  <desc id="desc">展示 LINE Webhook 分流後的員工定位打卡、照片處理及主管權限查詢路徑。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60798a"/></marker>
    <style>
      text{font-family:"Segoe UI","Noto Sans TC",sans-serif;fill:#183142}.heading{font-size:26px;font-weight:700}.lane{font-size:18px;font-weight:700}.node{font-size:14px;font-weight:650}.small{font-size:12px;fill:#536c7b}.arrow{fill:none;stroke:#60798a;stroke-width:2;marker-end:url(#arrow)}.box{rx:12;stroke-width:1.5}.start{fill:#e8f7ef;stroke:#7fbea0}.work{fill:#edf4fc;stroke:#8eafd0}.decision{fill:#fff4e7;stroke:#dfae71}.error{fill:#fff0ed;stroke:#df968b}.finish{fill:#e7f5f2;stroke:#70b7a5}.db{fill:#f2effb;stroke:#b2a0d6}.muted{fill:#f5f7f8;stroke:#c6d0d6}.lane-bg{fill:#fbfcfd;stroke:#d8e1e6;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1450" height="1050" fill="#fff"/>
  <text x="48" y="52" class="heading">n8n 工作流程｜員工打卡與主管查詢</text>
  <text x="48" y="78" class="small">根據目前匯出 Workflow 的節點與連線整理；這是流程示意圖，不是執行畫面。</text>

  <rect x="35" y="110" width="1380" height="580" class="lane-bg"/>
  <text x="58" y="145" class="lane">員工打卡路徑</text>
  <rect x="55" y="180" width="150" height="68" class="box start"/><text x="130" y="209" text-anchor="middle" class="node">LINE Webhook</text><text x="130" y="231" text-anchor="middle" class="small">位置／照片事件</text>
  <rect x="250" y="180" width="160" height="68" class="box work"/><text x="330" y="209" text-anchor="middle" class="node">主流程事件分流</text><text x="330" y="231" text-anchor="middle" class="small">共用資料、訊息類型</text>
  <rect x="455" y="180" width="165" height="68" class="box db"/><text x="537" y="209" text-anchor="middle" class="node">查詢／整理員工</text><text x="537" y="231" text-anchor="middle" class="small">Google Sheets</text>
  <rect x="665" y="180" width="155" height="68" class="box work"/><text x="742" y="209" text-anchor="middle" class="node">取得啟用地點</text><text x="742" y="231" text-anchor="middle" class="small">計算距離</text>
  <polygon points="900,168 981,214 900,260 819,214" class="box decision"/><text x="900" y="210" text-anchor="middle" class="node">地點／距離</text><text x="900" y="229" text-anchor="middle" class="small">有效？</text>
  <rect x="1040" y="155" width="155" height="65" class="box db"/><text x="1117" y="182" text-anchor="middle" class="node">讀取班別與</text><text x="1117" y="202" text-anchor="middle" class="small">當日打卡紀錄</text>
  <polygon points="1270,145 1352,191 1270,237 1188,191" class="box decision"/><text x="1270" y="188" text-anchor="middle" class="node">判斷類型</text><text x="1270" y="207" text-anchor="middle" class="small">與時間規則</text>
  <path d="M205 214H245M410 214H450M620 214H660M820 214H818M981 191H1035M1195 187H1185" class="arrow"/>

  <rect x="770" y="320" width="190" height="72" class="box error"/><text x="865" y="350" text-anchor="middle" class="node">拒絕成功寫入</text><text x="865" y="373" text-anchor="middle" class="small">超距／無有效地點</text>
  <rect x="1090" y="320" width="190" height="72" class="box work"/><text x="1185" y="350" text-anchor="middle" class="node">檢查待完成打卡</text><text x="1185" y="373" text-anchor="middle" class="small">上班照片狀態／期限</text>
  <polygon points="1185,430 1267,476 1185,522 1103,476" class="box decision"/><text x="1185" y="472" text-anchor="middle" class="node">上班需照片</text><text x="1185" y="491" text-anchor="middle" class="small">或下班定位？</text>
  <rect x="935" y="555" width="205" height="78" class="box work"/><text x="1037" y="585" text-anchor="middle" class="node">要求照片／配對</text><text x="1037" y="609" text-anchor="middle" class="small">90 秒暫存狀態</text>
  <rect x="1170" y="555" width="205" height="78" class="box work"/><text x="1272" y="585" text-anchor="middle" class="node">定位下班寫入路徑</text><text x="1272" y="609" text-anchor="middle" class="small">含允許的重複異常</text>
  <rect x="680" y="555" width="210" height="78" class="box db"/><text x="785" y="585" text-anchor="middle" class="node">照片下載／Drive 上傳</text><text x="785" y="609" text-anchor="middle" class="small">更新正式紀錄與暫存狀態</text>
  <rect x="440" y="555" width="205" height="78" class="box finish"/><text x="542" y="585" text-anchor="middle" class="node">依寫入結果回覆</text><text x="542" y="609" text-anchor="middle" class="small">成功／失敗／異常</text>
  <path d="M900 260V300H865V315M1270 237V280H1185V315M1185 392V425M1103 476H1037V550M1267 476H1272V550M935 594H895M680 594H650" class="arrow"/>
  <text x="915" y="293" class="small">否</text><text x="1290" y="277" class="small">是</text><text x="1083" y="461" class="small">需要照片</text><text x="1275" y="535" class="small">定位即可</text>

  <rect x="35" y="720" width="1380" height="285" class="lane-bg"/>
  <text x="58" y="755" class="lane">主管查詢路徑</text>
  <rect x="70" y="805" width="185" height="72" class="box start"/><text x="162" y="835" text-anchor="middle" class="node">查詢指令</text><text x="162" y="858" text-anchor="middle" class="small">由主流程分流</text>
  <rect x="315" y="805" width="190" height="72" class="box db"/><text x="410" y="835" text-anchor="middle" class="node">讀取主管資料</text><text x="410" y="858" text-anchor="middle" class="small">Google Sheets</text>
  <polygon points="650,790 736,841 650,892 564,841" class="box decision"/><text x="650" y="837" text-anchor="middle" class="node">userId 匹配</text><text x="650" y="857" text-anchor="middle" class="small">且狀態啟用？</text>
  <rect x="800" y="770" width="220" height="65" class="box error"/><text x="910" y="798" text-anchor="middle" class="node">回覆權限不足</text><text x="910" y="819" text-anchor="middle" class="small">不讀取主管結果</text>
  <rect x="790" y="875" width="220" height="72" class="box db"/><text x="900" y="905" text-anchor="middle" class="node">讀取打卡紀錄</text><text x="900" y="928" text-anchor="middle" class="small">依日期及查詢類型</text>
  <rect x="1070" y="875" width="190" height="72" class="box work"/><text x="1165" y="905" text-anchor="middle" class="node">整理查詢結果</text><text x="1165" y="928" text-anchor="middle" class="small">分頁／日期／狀態</text>
  <rect x="1290" y="875" width="105" height="72" class="box finish"/><text x="1342" y="905" text-anchor="middle" class="node">LINE</text><text x="1342" y="928" text-anchor="middle" class="small">回覆</text>
  <path d="M255 841H310M505 841H558M736 841H765V802H795M650 892V910H785M1010 911H1065M1260 911H1285" class="arrow"/>
  <text x="755" y="791" class="small">否</text><text x="662" y="905" class="small">是</text>
  <text x="58" y="980" class="small">分支框與節點為依現有 n8n 匯出整理；實際服務呼叫結果仍以 project-status.md 的測試證據為準。</text>
</svg>
