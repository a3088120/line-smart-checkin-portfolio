<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">LINE 智慧打卡系統架構</title>
  <desc id="desc">LINE Messaging API 連接 n8n 工作流程、Google Sheets、Google Drive、Cloudflare Pages LIFF、Pages Function、GAS 與 Google Maps Geocoding API。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52718a"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16856a"/></marker>
    <style>
      text{font-family:"Segoe UI","Noto Sans TC",sans-serif;fill:#142b3b}.title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#526777}.label{font-size:13px;fill:#526777}.box-title{font-size:17px;font-weight:700}.box-copy{font-size:13px;fill:#405768}.flow{fill:none;stroke:#52718a;stroke-width:2.2;marker-end:url(#arrow)}.secure{fill:none;stroke:#16856a;stroke-width:2.4;marker-end:url(#arrow-green)}.dashed{stroke-dasharray:7 6}.box{rx:15;stroke-width:1.5}.blue{fill:#edf5ff;stroke:#83a9d5}.green{fill:#eaf8f1;stroke:#7ec5a5}.purple{fill:#f3efff;stroke:#b29ae2}.orange{fill:#fff4e8;stroke:#e7b47c}.gray{fill:#f3f6f8;stroke:#bdcbd4}.tag{font-size:11px;font-weight:700;fill:#fff}.tag-bg{rx:8}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="48" y="55" class="title">LINE 智慧打卡系統｜系統架構</text>
  <text x="48" y="82" class="subtitle">依本機 n8n Workflow、GAS 與 Cloudflare Pages 程式整理的架構示意</text>

  <rect x="55" y="155" width="170" height="100" class="box gray"/>
  <text x="140" y="190" text-anchor="middle" class="box-title">員工／主管</text><text x="140" y="216" text-anchor="middle" class="box-copy">位置、照片、查詢指令</text>
  <rect x="290" y="155" width="190" height="100" class="box green"/>
  <text x="385" y="190" text-anchor="middle" class="box-title">LINE Messaging API</text><text x="385" y="216" text-anchor="middle" class="box-copy">Webhook 與訊息回覆</text>
  <path d="M225 205H285" class="flow"/><text x="255" y="190" text-anchor="middle" class="label">LINE</text>

  <rect x="545" y="125" width="290" height="410" class="box blue"/>
  <text x="690" y="160" text-anchor="middle" class="box-title">n8n 自動化流程</text>
  <rect x="580" y="185" width="220" height="82" class="box gray"/>
  <text x="690" y="216" text-anchor="middle" class="box-title">主流程／Webhook</text><text x="690" y="241" text-anchor="middle" class="box-copy">事件類型分流、呼叫子流程</text>
  <rect x="570" y="310" width="125" height="88" class="box green"/>
  <text x="632" y="342" text-anchor="middle" class="box-title">員工打卡</text><text x="632" y="365" text-anchor="middle" class="box-copy">位置、班別、狀態</text>
  <rect x="710" y="310" width="105" height="88" class="box purple"/>
  <text x="762" y="342" text-anchor="middle" class="box-title">主管查詢</text><text x="762" y="365" text-anchor="middle" class="box-copy">權限、日期、結果</text>
  <rect x="610" y="435" width="165" height="68" class="box orange"/>
  <text x="692" y="464" text-anchor="middle" class="box-title">Rich Menu 同步</text><text x="692" y="485" text-anchor="middle" class="box-copy">角色 link／unlink 流程</text>
  <path d="M480 205H575" class="flow"/><text x="525" y="190" text-anchor="middle" class="label">Webhook</text>
  <path d="M690 267V295M650 295H762M632 295V305M762 295V305" class="flow"/>

  <rect x="910" y="165" width="230" height="95" class="box green"/>
  <text x="1025" y="200" text-anchor="middle" class="box-title">Google Sheets</text><text x="1025" y="226" text-anchor="middle" class="box-copy">人員、地點、班別、出勤</text>
  <path d="M800 228H875V210H905" class="flow"/><text x="855" y="215" text-anchor="middle" class="label">資料查詢／寫入</text>
  <rect x="910" y="305" width="230" height="88" class="box orange"/>
  <text x="1025" y="340" text-anchor="middle" class="box-title">Google Drive</text><text x="1025" y="366" text-anchor="middle" class="box-copy">受權限控管的打卡照片</text>
  <path d="M695 350H860V350H905" class="flow"/><text x="847" y="338" text-anchor="middle" class="label">照片上傳／查詢</text>

  <rect x="55" y="395" width="190" height="105" class="box purple"/>
  <text x="150" y="432" text-anchor="middle" class="box-title">LINE LIFF 前端</text><text x="150" y="458" text-anchor="middle" class="box-copy">管理介面</text><text x="150" y="480" text-anchor="middle" class="box-copy">Cloudflare Pages</text>
  <rect x="290" y="395" width="190" height="105" class="box blue"/>
  <text x="385" y="432" text-anchor="middle" class="box-title">Pages Function</text><text x="385" y="458" text-anchor="middle" class="box-copy">同源 API 閘道</text><text x="385" y="480" text-anchor="middle" class="box-copy">來源與操作白名單</text>
  <rect x="545" y="580" width="230" height="105" class="box orange"/>
  <text x="660" y="618" text-anchor="middle" class="box-title">Google Apps Script</text><text x="660" y="644" text-anchor="middle" class="box-copy">LINE 身分／角色驗證</text><text x="660" y="666" text-anchor="middle" class="box-copy">管理資料 API</text>
  <rect x="910" y="555" width="230" height="95" class="box green"/>
  <text x="1025" y="590" text-anchor="middle" class="box-title">Google Maps API</text><text x="1025" y="616" text-anchor="middle" class="box-copy">地址轉座標（Geocoding）</text>
  <path d="M245 447H285" class="secure"/><text x="265" y="432" text-anchor="middle" class="label">LIFF</text>
  <path d="M480 447H510V632H540" class="secure"/><text x="500" y="538" class="label" transform="rotate(90 500 538)">伺服器端 API</text>
  <path d="M775 615H850V240H905" class="secure"/><text x="860" y="435" class="label" transform="rotate(-90 860 435)">授權後資料存取</text>
  <path d="M775 650H860V602H905" class="flow"/><text x="845" y="590" class="label">Geocoding</text>
  <path d="M1025 555V398" class="flow dashed"/><text x="1040" y="474" class="label">管理地址</text>
  <path d="M385 155V105H385" class="flow dashed"/>
  <text x="48" y="730" class="label">綠色連線：含登入／授權或伺服器端保護的管理資料流　｜　虛線：管理或角色同步等非主要打卡路徑</text>
</svg>
